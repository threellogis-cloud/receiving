<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7 & Under — Inventory v17</title>
<style>
html,body{margin:0;height:100%;background:#141814;overflow:hidden}
#appFrame{width:100%;height:100%;border:0;display:block;background:#141814}
#fail{display:none;position:fixed;inset:0;background:#141814;color:#e8ece8;font:16px/1.45 system-ui;padding:24px;z-index:10}
</style>
</head>
<body>
<iframe id="appFrame" src="inventory-v16.html" title="RapidStock Inventory"></iframe>
<div id="fail">Inventory could not load. <a href="listing-review.html" style="color:#f5b82e">Open Founder Review</a></div>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)throw new Error('no document');
    const ebay=d.querySelector('#ebayPanel');
    if(ebay){
      [...ebay.querySelectorAll('.panel')].forEach(p=>{
        const lbl=p.querySelector('.lbl');
        if(lbl && lbl.textContent.trim()==='PRICING ASSUMPTIONS')p.remove();
      });
      if(!d.querySelector('#founderListingControl')){
        const panel=d.createElement('div');
        panel.className='panel'; panel.id='founderListingControl';
        panel.innerHTML='<div class="lbl">FOUNDER LISTING CONTROL</div><button id="openFounderReview">Open Founder Review Queue</button><div class="lbl" style="margin-top:8px">Needs Review → Ready → Approved → Live. API-created eBay listings are edited here.</div>';
        ebay.insertBefore(panel,ebay.firstChild);
        panel.querySelector('#openFounderReview').onclick=()=>{window.location.href='listing-review.html'};
      }
    }
    const f=d.querySelector('footer'); if(f)f.textContent='inventory v17 · Founder Review control plane';
    d.title='7 & Under — Inventory v17';
  }catch(e){console.error(e);document.getElementById('fail').style.display='block';}
});
</script>
</body>
</html>
