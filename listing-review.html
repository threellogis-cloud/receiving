<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RapidStock — Founder Listing Review</title>
<style>
:root{--bg:#111412;--card:#191d1a;--line:#2a2f2b;--ink:#e8e6df;--dim:#9aa096;--amber:#f5b02e;--green:#7fbf6a;--red:#e06c5a;--blue:#79a9e8;--mono:ui-monospace,Menlo,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui;padding:14px 14px 70px}h1{font-size:18px;margin:0}a{color:var(--amber)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.card{cursor:pointer}.muted,.lbl{color:var(--dim)}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.ids{font:12px var(--mono);color:var(--dim)}.title{font-weight:700;margin:3px 0}.state,.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font:700 11px var(--mono);margin:5px 4px 0 0}.needs_review{color:var(--amber);border-color:var(--amber)}.ready{color:var(--blue);border-color:var(--blue)}.approved,.live{color:var(--green);border-color:var(--green)}.warn{border:1px solid var(--amber);color:var(--amber);border-radius:8px;padding:9px;margin:8px 0}.bad{border-color:var(--red);color:var(--red)}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0d100e;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 9px}textarea{min-height:120px}button{width:100%;background:var(--amber);border:0;border-radius:8px;padding:11px;font-weight:750;margin-top:8px}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.good{background:var(--green);color:#102010}.row{display:flex;gap:8px}.row>*{flex:1}.filters{display:flex;gap:6px;overflow:auto}.filters button{width:auto;min-width:max-content;background:transparent;color:var(--dim);border:1px solid var(--line);padding:7px 10px;margin:0}.filters button.on{background:var(--amber);color:#151515}.photoGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0d100e}.photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.photo .p{padding:7px}.photo button{padding:6px;margin-top:5px}.price{font:800 24px var(--mono);color:var(--amber)}#detail{display:none}.event{border-left:2px solid var(--line);padding:6px 9px;margin:5px 0}.spinner{text-align:center;color:var(--dim);padding:20px}button:disabled{opacity:.72;cursor:wait}button.busy{position:relative;filter:saturate(.8)}button.busy::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><div><h1>RapidStock / Founder Review</h1><div class="muted">Machine draft + Founder overrides → eBay</div></div><a href="inventory.html">Inventory</a></div>
<div id="login" class="panel" hidden><div class="lbl">Email</div><input id="email" type="email"><div class="lbl">Password</div><input id="pass" type="password"><button id="signin">Sign in</button></div>
<div id="queue" hidden><div class="panel"><div class="filters" id="filters"></div><div id="summary" class="muted" style="margin-top:8px"></div></div><div id="cards"></div></div>
<div id="detail"></div><div id="error" class="warn bad" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://fuebtrlaroowedjxjucn.supabase.co",SB_KEY="sb_publishable_-CrujyffVlSXhnst670YEA_-0aRK4Ti";const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:"rapidstock-owner-v2"}});const $=s=>document.querySelector(s);let rows=[],filter="all",current=null,photoDraft=[];
const esc=s=>s==null?"":String(s).replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));const money=v=>v==null?"—":"$"+Number(v).toFixed(2);function fail(m){const e=$("#error");e.textContent=m||"";e.style.display=m?"block":"none";if(m)e.scrollIntoView({block:"center"})}
function setBusy(btn,label){if(!btn||btn.disabled)return false;btn.dataset.idleText=btn.textContent;btn.disabled=true;btn.classList.add("busy");btn.textContent=label||"Working…";return true}function clearBusy(btn){if(!btn)return;btn.disabled=false;btn.classList.remove("busy");if(btn.dataset.idleText){btn.textContent=btn.dataset.idleText;delete btn.dataset.idleText}}async function withBusy(btn,label,fn){if(!setBusy(btn,label))return;try{return await fn()}finally{if(document.body.contains(btn))clearBusy(btn)}}
function label(x){return ({required_aspects_missing:"Required eBay item specific needs your choice",packed_weight_missing:"Package weight is missing",real_photo_missing:"No real item photo is available",packed_dimensions_estimated:"Package dimensions are estimated (not a blocker)",only_one_real_item_photo:"Only one real Nellis item photo is available"})[x]||String(x).replaceAll("_"," ")}
async function authDiagnostic(){const {data:{session}}=await sb.auth.getSession();if(!session)return {sub:"none",status:"no_session"};let status="error";try{const r=await fetch(SB_URL+"/auth/v1/user",{headers:{apikey:SB_KEY,Authorization:"Bearer "+session.access_token}});status=r.status}catch(_){status="network_error"}return {sub:session.user?.id||"unknown",status}}
async function verifyOwnerAuth(){const probe="00000000000000000000000000000000";let data=null;try{data=await edgeInvoke("ebay-inventory-writer",{action:"delete_review",capture_id:probe},true)}catch(e){const d=await authDiagnostic();throw new Error((e.message||String(e))+" · SUB: "+d.sub+" · STATUS: "+d.status)}if(data?.stage==="confirm_required")return true;const d=await authDiagnostic();const ad=data?.authdiag?(" · DIAG: "+JSON.stringify(data.authdiag)):"";throw new Error((data?.stage||"owner_auth_probe_failed")+ad+" · SUB: "+d.sub+" · STATUS: "+d.status)}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$("#login").hidden=false;return}try{await verifyOwnerAuth()}catch(e){fail("Owner authorization check failed: "+(e.message||String(e))+". Sign out and sign back in.");return}await loadQueue()}
$("#signin").onclick=()=>withBusy($("#signin"),"Signing in…",async()=>{fail("");const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pass").value});if(error)return fail(error.message);try{await verifyOwnerAuth()}catch(e){return fail("Owner authorization check failed: "+(e.message||String(e)))}$("#login").hidden=true;await loadQueue()});
async function loadQueue(){fail("");$("#queue").hidden=false;$("#cards").innerHTML='<div class="spinner">Loading review queue…</div>';const {data,error}=await sb.from("ebay_listing_review").select("capture_id,inventory_number,sku,review_state,effective_payload,founder_overrides,blocker_details,warning_details,aspect_choices,updated_at,live_synced_at").order("updated_at",{ascending:false});if(error)return fail("Review queue: "+error.message);rows=data||[];renderFilters();renderCards()}
function renderFilters(){const states=["all","needs_review","ready","approved","live"];$("#filters").innerHTML=states.map(s=>'<button class="'+(s===filter?'on':'')+'" data-f="'+s+'">'+s.replace("_"," ")+' ('+(s==="all"?rows.length:rows.filter(r=>r.review_state===s).length)+')</button>').join("");$("#filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();renderCards()})}
function renderCards(){const v=rows.filter(r=>filter==="all"||r.review_state===filter);$("#summary").textContent=v.length+" listing"+(v.length===1?"":"s")+" shown";$("#cards").innerHTML=v.map(r=>{const p=r.effective_payload||{},pr=p.price||{},cat=p.category?.selected||{},photos=p.photo_records||[];return '<div class="card" data-id="'+esc(r.capture_id)+'"><span class="state '+esc(r.review_state)+'">'+esc(r.review_state.replace("_"," "))+'</span><div class="title">'+esc(p.title||"Untitled")+'</div><div class="ids">INV# '+esc(r.inventory_number)+' · '+esc(r.sku)+'</div><div style="margin-top:5px"><span class="price">'+money(pr.value)+'</span> <span class="muted">· '+esc(cat.name||cat.id||"category pending")+' · '+photos.length+' photo'+(photos.length===1?"":"s")+'</span></div>'+((r.blocker_details||[]).length?'<div class="warn bad">'+r.blocker_details.map(label).map(esc).join(" · ")+'</div>':"")+((r.warning_details||[]).length?'<div class="warn">'+r.warning_details.map(label).map(esc).join(" · ")+'</div>':"")+'</div>'}).join("")||'<div class="panel muted">No listings in this state.</div>';$("#cards").querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
function aspectEditor(r,p){const miss=p.required_aspects?.missing_required||[],resolved=p.required_aspects?.resolved||{},choices=r.aspect_choices||{};let h='<div class="panel"><div class="lbl">eBay item specifics</div>';if(!miss.length)h+='<div class="tag approved">Required specifics complete</div>';for(const name of miss){const c=choices[name]||{},vals=c.allowed_values||[],suggest=(c.suggested_values||[])[0]||"";h+='<div class="warn bad"><b>'+esc(name)+'</b> is required by eBay.</div><div class="lbl">Choose '+esc(name)+'</div>';if(vals.length)h+='<select data-aspect="'+esc(name)+'"><option value="">— choose —</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+(v===suggest?' — suggested':'')+'</option>').join("")+'</select>';else h+='<input data-aspect="'+esc(name)+'" placeholder="Enter '+esc(name)+'">'}const keys=Object.keys(resolved);if(keys.length)h+='<div class="muted" style="margin-top:5px">'+keys.map(k=>'<span class="tag">'+esc(k)+': '+esc((resolved[k]||[]).join(", "))+'</span>').join("")+'</div>';return h+'</div>'}
function photoEditor(p){photoDraft=(p.photos||[]).slice();const rec=p.photo_records||[];return '<div class="panel"><div class="lbl">Photos · stock does not count as a real-item photo</div><div class="photoGrid" id="photoGrid">'+photoDraft.map((u,i)=>{const r=rec.find(x=>x.url===u)||{},kind=r.kind||"other";return '<div class="photo" data-photo="'+i+'"><img src="'+esc(u)+'" alt=""><div class="p"><span class="tag">#'+(i+1)+' '+esc(kind)+'</span><button class="ghost" data-pup="'+i+'">↑ Move up</button><button class="ghost" data-pdel="'+i+'">Remove</button></div></div>'}).join("")+'</div><div class="lbl" style="margin-top:10px">Add a real item photo — JPEG or PNG, at least 500px on the longest side</div><input type="file" id="uploadPhoto" accept="image/jpeg,image/png" style="margin:0 0 9px"><button id="uploadPhotoBtn" style="margin:0 0 9px">Upload photo</button></div>'}
async function openDetail(id){current=rows.find(r=>r.capture_id===id);if(!current)return;$("#queue").hidden=true;const p=current.effective_payload||{},d=p.shipping?.box_dimensions_in||{},prov=p.shipping?.provenance||{},cat=p.category?.selected||{},pp=p.photo_policy||{};let h='<div class="panel"><button class="ghost" id="back">← Review Queue</button><span class="state '+esc(current.review_state)+'">'+esc(current.review_state.replace("_"," "))+'</span><div class="title" style="font-size:19px">'+esc(p.title||"Untitled")+'</div><div class="ids">INV# '+esc(current.inventory_number)+' · '+esc(current.sku)+' · eBay category '+esc(cat.id||"—")+'</div></div>';
h+=((current.blocker_details||[]).length?'<div class="warn bad"><b>Needs your help</b><br>'+current.blocker_details.map(label).map(esc).join("<br>")+'</div>':"")+((current.warning_details||[]).length?'<div class="warn"><b>Warnings — do not block flow</b><br>'+current.warning_details.map(label).map(esc).join("<br>")+'</div>':"");h+=aspectEditor(current,p);
h+='<div class="panel"><div class="lbl">Listing title</div><input id="title" maxlength="80" value="'+esc(p.title||"")+'"><div class="lbl">Price · current policy '+esc(p.price?.percentage||"")+' of lowest relevant Buy It Now comp</div><input id="price" type="number" step="0.01" inputmode="decimal" value="'+esc(p.price?.value||"")+'"><div class="muted">Reference '+money(p.price?.reference)+' · week '+esc(p.price?.week_index??0)+' · policy '+esc(p.price?.policy||"—")+'</div><div class="lbl" style="margin-top:10px">Description</div><textarea id="desc">'+esc(p.description_draft||"")+'</textarea></div>';
h+='<div class="panel"><div class="lbl">Calculated shipping package</div><div class="row"><div><div class="lbl">Length</div><input id="len" type="number" step="0.01" value="'+esc(d.length||"")+'"></div><div><div class="lbl">Width</div><input id="wid" type="number" step="0.01" value="'+esc(d.width||"")+'"></div><div><div class="lbl">Height</div><input id="hei" type="number" step="0.01" value="'+esc(d.height||"")+'"></div></div><div class="lbl">Packed weight lb</div><input id="weight" type="number" step="0.01" value="'+esc(p.shipping?.weight_lb||"")+'"><div class="muted">Dimension source: '+esc(prov.dimensions||"—")+' · confidence: '+esc(prov.dimension_confidence||"—")+(prov.dimensions_estimated?' · ESTIMATED':'')+'</div></div>';
h+=photoEditor(p);h+='<div class="panel"><div class="lbl">Photo policy</div><span class="tag">'+esc(pp.stock_count||0)+' stock</span><span class="tag">'+esc(pp.real_item_count||0)+' real item</span><div id="actions"></div></div><div class="panel"><div class="lbl">Audit trail</div><div id="events" class="muted">Loading…</div></div>';$("#detail").innerHTML=h;$("#detail").style.display="block";wireDetail();await loadEvents(id)}
function collect(){const aspects={};document.querySelectorAll("[data-aspect]").forEach(e=>{if(e.value.trim())aspects[e.dataset.aspect]=[e.value.trim()]});return {title:$("#title").value.trim(),description_draft:$("#desc").value,price_value:$("#price").value,aspects,shipping:{weight_lb:$("#weight").value,box_dimensions_in:{length:$("#len").value,width:$("#wid").value,height:$("#hei").value}},photos:photoDraft.slice()}}
async function functionAuthHeaders(){let {data,error}=await sb.auth.getSession();if(error)throw new Error("Session error: "+error.message);let session=data?.session;if(!session)throw new Error("Your owner session is missing. Sign in again.");if(session.expires_at&&session.expires_at*1000<Date.now()+60000){const r=await sb.auth.refreshSession();if(r.error)throw new Error("Session refresh failed: "+r.error.message);session=r.data?.session;if(!session)throw new Error("Your owner session could not be refreshed. Sign in again.")}return {Authorization:"Bearer "+session.access_token}}
async function edgeInvoke(name,body,allowErrorBody=false){const auth=await functionAuthHeaders();const r=await fetch(SB_URL+"/functions/v1/"+encodeURIComponent(name),{method:"POST",headers:{apikey:SB_KEY,Authorization:auth.Authorization,"Content-Type":"application/json"},body:JSON.stringify(body)});let data=null;try{data=await r.json()}catch(_){data={stage:"non_json_response",http:r.status}}if(!r.ok&&!allowErrorBody)throw new Error((data?.stage||"request")+" ("+r.status+"): "+JSON.stringify(data?.blockers||data?.error||data));return data}
async function invoke(name,body){const data=await edgeInvoke(name,body);if(data?.ok===false)throw new Error((data.stage||"request")+": "+JSON.stringify(data.blockers||data.error||data));return data}
async function save(refresh=true){fail("");try{const out=await invoke("ebay-inventory-writer",{action:"save_overrides",capture_id:current.capture_id,overrides:collect()});if(refresh){await loadQueue();await openDetail(current.capture_id)}return out}catch(e){fail(e.message||String(e));throw e}}
async function approve(){try{await save(false);const out=await invoke("ebay-inventory-writer",{action:"approve_review",capture_id:current.capture_id});await loadQueue();await openDetail(current.capture_id);return out}catch(e){fail(e.message||String(e));throw e}}
async function publishNow(){if(!confirm("Publish this approved listing to eBay now?"))return;try{const out=await invoke("ebay-publish-approved",{capture_id:current.capture_id});await loadQueue();await openDetail(current.capture_id);return out}catch(e){fail(e.message||String(e))}}
async function syncLive(){try{await save(false);await invoke("ebay-inventory-writer",{action:"sync_review",capture_id:current.capture_id});await loadQueue();await openDetail(current.capture_id)}catch(e){fail(e.message||String(e));throw e}}
const MAX_IMAGE_BYTES=12*1024*1024; // mirror the writer's raw-byte cap; fail fast locally
async function callWriter(action,extra){return await edgeInvoke("ebay-inventory-writer",Object.assign({action,capture_id:current.capture_id},extra||{}),true)}
function uploadMsg(d){const s=d&&d.stage;if(s==="image_too_small")return "That image is too small ("+(d.width||"?")+"×"+(d.height||"?")+"px; needs "+(d.min_longest_side||500)+"px on the longest side).";if(s==="image_too_large")return "That file is too large ("+Math.round((d.bytes||0)/1048576)+" MB; max "+Math.round((d.max_bytes||MAX_IMAGE_BYTES)/1048576)+" MB).";if(s==="image_type_invalid")return "That file is not a JPEG or PNG image (checked by content, not the file name).";if(s==="image_undecodable")return "That image could not be read; try re-exporting it.";if(s==="image_missing")return "No image was provided.";if(s==="review_missing")return "This review no longer exists; refresh the queue.";if(s==="owner_required")return "You must be signed in as the owner to do that.";if(s==="storage_upload")return "The photo store rejected the upload: "+(d.error||"unknown error")+".";return (s||"request")+": "+JSON.stringify(d)}
function fileToBase64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("could not read the file"));fr.onload=()=>{const r=String(fr.result||""),i=r.indexOf(",");res(i>=0?r.slice(i+1):r)};fr.readAsDataURL(file)})}
async function uploadPhoto(){const btn=$("#uploadPhotoBtn"),inp=$("#uploadPhoto"),file=inp&&inp.files&&inp.files[0];if(!file)return fail("Choose a JPEG or PNG file first.");if(file.size>MAX_IMAGE_BYTES)return fail("That file is too large ("+Math.round(file.size/1048576)+" MB; max "+Math.round(MAX_IMAGE_BYTES/1048576)+" MB). Pick a smaller image.");return withBusy(btn,"Uploading…",async()=>{fail("");try{const image_base64=await fileToBase64(file);const out=await callWriter("upload_photo",{image_base64});if(out&&out.ok===false)return fail(uploadMsg(out));await loadQueue();await openDetail(current.capture_id)}catch(e){fail(e.message||String(e))}})}
async function removePhotoAt(i){const url=photoDraft[i];const recs=(current.effective_payload||{}).photo_records||[];const kind=(recs.find(x=>x.url===url)||{}).kind||"other";if(kind!=="founder_upload"){photoDraft.splice(i,1);return rerenderPhotoOnly()}fail("");const obj=((current.founder_overrides&&current.founder_overrides.uploaded_photos)||[]).find(x=>x.url===url)?.object_name||(url.match(/\/founder-review-photos\/(.+)$/)||[])[1];if(!obj)return fail("Could not resolve the uploaded photo to remove.");try{const out=await callWriter("remove_photo",{object_name:obj});if(out&&out.ok===false)return fail(uploadMsg(out));await loadQueue();await openDetail(current.capture_id)}catch(e){fail(e.message||String(e))}}
async function deleteReview(){if(!confirm("Delete this review permanently? This removes the review and its listing state and cannot be undone."))return;fail("");try{const out=await callWriter("delete_review",{confirm:current.capture_id});if(out&&out.ok===false){if(out.stage==="delete_refused_live_listing")return fail("This listing is LIVE on eBay (listing "+(out.listing_id||"?")+"). End the eBay listing first, then delete.");return fail(uploadMsg(out))}$("#detail").style.display="none";$("#queue").hidden=false;current=null;await loadQueue()}catch(e){fail(e.message||String(e))}}
function wireDetail(){$("#back").onclick=()=>{$("#detail").style.display="none";$("#queue").hidden=false;current=null};wirePhotoControls();renderActions()}
function rerenderPhotoOnly(){const p={...(current.effective_payload||{}),photos:photoDraft,photo_records:(current.effective_payload||{}).photo_records||[]};const wrap=$("#photoGrid").parentElement;wrap.outerHTML=photoEditor(p);wirePhotoControls()}
function wirePhotoControls(){const g=$("#photoGrid");if(g)g.onclick=e=>{const del=e.target.closest("[data-pdel]"),up=e.target.closest("[data-pup]");if(del){if(del.disabled)return;const i=Number(del.dataset.pdel),recs=(current.effective_payload||{}).photo_records||[],url=photoDraft[i],kind=(recs.find(x=>x.url===url)||{}).kind||"other";if(kind==="founder_upload")withBusy(del,"Removing…",()=>removePhotoAt(i));else{del.textContent="Removed";del.disabled=true;removePhotoAt(i)}}else if(up){if(up.disabled)return;const i=Number(up.dataset.pup);if(i>0){up.textContent="Moved";up.disabled=true;[photoDraft[i-1],photoDraft[i]]=[photoDraft[i],photoDraft[i-1]];rerenderPhotoOnly()}}};const b=$("#uploadPhotoBtn");if(b)b.onclick=uploadPhoto}
function renderActions(){const a=$("#actions"),s=current.review_state;const liveDirty=s==="live"&&(!current.live_synced_at||new Date(current.updated_at).getTime()>new Date(current.live_synced_at).getTime()+1000);let h='<button class="ghost" id="save">Save changes</button>';if(s==="needs_review"||s==="ready")h+='<button class="good" id="approve">Approve listing package</button>';if(s==="approved")h+='<button class="good" id="publish">Publish to eBay</button>';if(s==="live"){if(liveDirty)h+='<button class="good" id="syncLive">Update live eBay listing</button>';else h+='<button class="good" id="liveDone" disabled>✓ Live on eBay</button>'}h+='<button class="ghost" id="deleteReview" style="border-color:var(--red);color:var(--red);margin-top:16px">Delete this review permanently</button>';a.innerHTML=h;$("#save").onclick=()=>withBusy($("#save"),"Saving…",()=>save().catch(()=>{}));if($("#approve"))$("#approve").onclick=()=>withBusy($("#approve"),"Approving…",approve);if($("#publish"))$("#publish").onclick=()=>withBusy($("#publish"),"Publishing…",publishNow);if($("#syncLive"))$("#syncLive").onclick=()=>withBusy($("#syncLive"),"Updating eBay…",syncLive);$("#deleteReview").onclick=()=>withBusy($("#deleteReview"),"Deleting…",deleteReview)}
async function loadEvents(id){const {data,error}=await sb.from("ebay_review_events").select("event_type,detail,created_at").eq("capture_id",id).order("created_at",{ascending:false}).limit(30);const e=$("#events");if(error){e.textContent=error.message;return}e.innerHTML=(data||[]).map(x=>'<div class="event"><b>'+esc(x.event_type.replaceAll("_"," "))+'</b><br><span class="ids">'+esc(new Date(x.created_at).toLocaleString())+'</span></div>').join("")||'No events yet.'}
boot();
</script>
</body>
</html>
